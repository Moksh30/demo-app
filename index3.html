<!DOCTYPE html>
<html>
  <head>
    <style>
      .main {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .main0 {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }
      .main1 {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }
      .main2 {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }
      .main3 {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }
      .main4 {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        width: 30px;
        height: 30px;
        font-size: 20px;
      }
      .in {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
        align-items: center;
        text-align: center;
        gap: 10px;
      }
      .zero {
        background-color: whitesmoke;
        padding: 50px;
        width: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        height: 100%;
      }
    </style>
    <title>Calculator App</title>
  </head>
  <body>
    <div class="zero">
      <div class="in">
        <input type="text" id="displaydata" /><button onclick="calculate()">
          =
        </button>
      </div>
      <div class="main">
        <div class="main0">
          <button onclick="clearall()" class="btn">c</button>
          <button onclick="operation('/')" class="btn">/</button>
          <button onclick="number('0')" class="btn">0</button>
        </div>
        <div class="main1">
          <button onclick="operation('+')" class="btn">+</button>
          <button onclick="operation('-')" class="btn">-</button>
          <button onclick="operation('*')" class="btn">*</button>
        </div>
        <div class="main2">
          <button onclick="number('7')" class="btn">7</button>
          <button onclick="number('6')" class="btn">6</button>
          <button onclick="number('3')" class="btn">3</button>
        </div>
        <div class="main3">
          <button onclick="number('8')" class="btn">8</button>
          <button onclick="number('5')" class="btn">5</button>
          <button onclick="number('2')" class="btn">2</button>
        </div>
        <div class="main4">
          <button onclick="number('9')" class="btn">9</button>
          <button onclick="number('4')" class="btn">4</button>
          <button onclick="number('1')" class="btn">1</button>
        </div>
      </div>
    </div>
    <script>
      let prev = "";
      let ope = "";
      let cur = "";

      function number(n) {
        cur = +n;
        const displaydata = document.getElementById("displaydata");
        displaydata.value = `${prev} ${ope} ${cur}`;
      }
      console.log("currentoutside", cur);

      function operation(op) {
        console.log(op);
        if (cur === "") return;
        if (prev !== "") {
          calculate();
        }
        ope = op;
        prev = cur;
        cur = "";
        const displaydata = document.getElementById("displaydata");
        displaydata.value = ` ${prev} ${ope} ${cur}`;
      }

      function calculate() {
        console.log("ope", ope);
        let result = "";
        console.log("ope2", ope);

        switch (ope) {
          case "+":
            result = prev + cur;
            break;
          case "-":
            result = prev - cur;
            break;
          case "/":
            if (cur === 0) {
              console.log("Current Value is Zero");
            }
            result = prev / cur;
            break;
          case "*":
            result = prev * cur;
            break;
        }
        cur = result;
        console.log("result", result);

        prev = "";
        ope = "";
        document.getElementById("displaydata").value = cur;
      }

      function clearall() {
        cur = "";
        prev = "";
        ope = "";
        document.getElementById("displaydata").value = cur;
      }
    </script>
  </body>
</html>
