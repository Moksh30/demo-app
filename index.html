<!DOCTYPE html>
<html>
  <head>
    <title>Product Catlog</title>
    <style>
      /* CSS */

      .main {
        border-radius: 5px;
        background-color: #f2f2f2;
        padding: 20px;
        border: 1px solid #ffffff;
        border-radius: 20px;
        width: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .mh {
        display: flex;
        flex-direction: row;
        gap: 20px;
      }
      .main2 {
        border-radius: 5px;
        padding: 20px;
        width: 400px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
      }
      body {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }

      .main2 {
        width: 100%;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: flex-start;
      }
      #key2 {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .heart {
        display: flex;
        justify-content: center;
        flex-direction: column;
      }
      .heart1 {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        flex-direction: column;
      }
      .sl {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .hj {
        display: flex;
        text-transform: none;
        margin-top: 10px;
        padding: 10px;
      }
      .hl4 {
        border: 1px solid #262626;
        display: flex;
        width: 100%;
        background-color: red;
        height: 100%;
        min-height: 40px;
        color: #ffffff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- HTML-->
    <div class="main">
      <form id="my-form">
        <div class="mh">
          <div class="heart1">
            <label class="hj" for="ProductName">Product Name:</label>
            <label class="hj" for="ProductPrice">Product Price:</label>
            <label class="hj" for="ProductDescription"
              >Product Description:</label
            >
          </div>

          <div class="heart">
            <input
              class="hj"
              type="text"
              id="ProductName"
              name="ProductName"
              placeholder="ProductName"
              required
            />

            <input
              class="hj"
              type="number"
              id="ProductPrice"
              placeholder="Price"
              name="ProductPrice"
              required
            />

            <input
              class="hj"
              type="text"
              placeholder="Enter Description"
              id="ProductDescription"
              name="ProductDescription"
              required
            />
          </div>
        </div>
        <div class="sl">
          <input class="hl4" type="submit" value="Submit" id="ds" />
        </div>
      </form>
    </div>

    <div class="main2" id="result"></div>

    <!-- Javascript Code -->
    <script>
      const form = document.getElementById("my-form");
      const result = document.getElementById("result");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const output = {
          id: Date.now(),
          ProductName: form.ProductName.value,
          ProductPrice: form.ProductPrice.value,
          ProductDescription: form.ProductDescription.value,
        };

        const red = document.createElement("div");
        const list1 = document.getElementsByClassName("h1");
        red.innerHTML = `
          <ul class="h1" id="${output.id}">
              <li>Product Name: ${output.ProductName}</li>
              <li> Product Price: ${output.ProductPrice}</li>
              <li> Product Description: ${output.ProductDescription}</li>
              <button id='key2' onclick="handleclick('${output.id}')">Delete</button>
            </ul>
          `;

        form.reset();
        console.log(list1);
        result.appendChild(red);
      });

      function handleclick(id) {
        if (id) {
          const result2 = document.getElementById(id);
          //   console.log("result", result2);
          //   result2.remove();
          result.removeChild(result2);
        }
        console.log(id);
      }
    </script>
  </body>
</html>
